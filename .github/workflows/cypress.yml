name: Cypress Tests

on:
  push:
    branches:
      - main
      - chore/portfolio-quality-improvements
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start deterministic Adopet API
        run: |
          node scripts/adopet-api-mock.js > /tmp/adopet-api-mock.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4177/health > /dev/null; then
              echo "Adopet API mock is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Adopet API mock did not start."
          cat /tmp/adopet-api-mock.log
          exit 1

      - name: Run Cypress
        run: npm test
        env:
          CYPRESS_ADOPET_API_URL: http://127.0.0.1:4177

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results
          path: |
            cypress/results
            cypress/videos
            cypress/screenshots
            /tmp/adopet-api-mock.log
          if-no-files-found: ignore
          retention-days: 7
